name: Checks

# The instant, browser-free gates from AGENTS.md's Testing table, plus a
# no-GPU browser job. The GPU gates (smoke.mjs, ui-smoke.mjs in full) cannot
# run on hosted runners; why, and what runs where: docs/testing.md.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  instant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Default (shallow, fetch-depth 1) is enough: check_notation.py's
        # only git call is `git ls-files`, which reads the checked-out INDEX,
        # not commit history -- verified locally (`git log -1` still works,
        # and ls-files does not consult history at all) rather than assumed.
        # fetch-depth 0 would buy this workflow nothing and cost a full clone.

      # ubuntu-latest ships a working python3 already, and neither checker
      # imports anything beyond the standard library (both docstrings say
      # "zero dependencies") -- a setup-python step would pin an interpreter
      # for no package to install against, so this relies on the runner's
      # system python3 instead. Node IS pinned, because check_pack.py hands
      # js/exercises.js to `node` to parse it as real JS (see its docstring),
      # and the two .mjs suites run under it directly; AGENTS.md documents
      # Node 22+ as this repo's floor.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: python3 --version / node --version
        run: |
          python3 --version
          node --version

      # check_notation.py falls back to a filesystem walk when `git ls-files`
      # fails (e.g. repo exported as a tarball) -- correct on a laptop, but in
      # CI that fallback silently scanning the wrong file set must never be
      # what actually ran under a green tick. This step cannot see inside the
      # checker's own subprocess call, but it proves git ls-files works in
      # this exact checkout, in this exact job, immediately before the
      # checker runs -- so if its internal call still fell back, something
      # broke git itself between these two steps.
      - name: Verify git ls-files works (check_notation.py depends on it)
        run: |
          count=$(git ls-files | wc -l)
          echo "git ls-files tracked $count files"
          if [ "$count" -lt 1 ]; then
            echo "::error::git ls-files returned nothing -- check_notation.py would silently fall back to a filesystem walk and scan the wrong file set"
            exit 1
          fi

      - name: check_pack.py — the exercise pack agrees with itself
        run: python3 exercises/_runner/check_pack.py

      - name: check_notation.py — one notation everywhere
        env:
          CI: "1"
        run: python3 test/check_notation.py

      - name: check_headers.py — every js/*.js carries its header
        run: python3 test/check_headers.py js/*.js

      - name: check_docs.py — the docs name only files and suites that exist
        run: python3 test/check_docs.py

      - name: recon-test.mjs — RECON's closed-form answers
        run: node test/recon-test.mjs

      - name: geom-test.mjs — GEOM's closed-form answers
        run: node test/geom-test.mjs

      - name: mutation-test.mjs — proves recon-test.mjs can fail
        run: node test/mutation-test.mjs

      - name: smoke.mjs --check-catalogue — the mutation catalogue is sound (no browser)
        run: node test/smoke.mjs --check-catalogue

  # Browser checks that need no GPU and no physics budget, under the software
  # rasteriser. Blocking since it ran green on hosted runners (the fork's
  # Checks, 2026-10-18, on main and two branches).
  no-gpu:
    runs-on: ubuntu-latest
    env:
      SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: smoke.mjs --only=docs — the docs reader renders the markdown
        run: node test/smoke.mjs --only=docs

      - name: ui-smoke.mjs --only=file:// — boots from file:// with no errors
        run: node test/ui-smoke.mjs --only=file://

name: Deploy to GitHub Pages

# The app is static (no build step, no dependencies) and is copied through
# verbatim, but the deploy runs Jekyll (_config.yml) so the markdown briefs
# render as web pages. It runs only after the "Checks" workflow has succeeded
# on main, for exactly the commit Checks ran on. (A pull_request:closed trigger
# was tried and removed: the github-pages environment's main-only rule refuses
# it.) workflow_dispatch stays for a manual deploy.
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty on workflow_dispatch, which then checks out the triggering ref.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@v5
        # Turns Pages on itself the first time this runs against a repo where
        # it is available, so going public is the only manual step.
        with:
          enablement: true
      # Renders every .md into a themed page (jekyll-theme-primer, see
      # _config.yml) and copies everything else — the app included — verbatim.
      # README.md serves as its folder's index, so an exercise brief lives at
      # .../exercises/<folder>/ (a course's own: .../courses/<id>/exercises/<folder>/).
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4

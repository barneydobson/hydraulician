name: Deploy to GitHub Pages

# The app is static (no build step, no dependencies) and is copied through
# verbatim — but the deploy runs Jekyll (_config.yml) so the markdown briefs
# in exercises/ render as web pages rather than as raw text. Runs on pushes
# and merges to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Turns Pages on itself the first time this runs against a repo where
        # it is available, so going public is the only manual step.
        with:
          enablement: true
      # Renders every .md into a themed page (jekyll-theme-primer, see
      # _config.yml) and copies everything else — the app included — verbatim.
      # README.md serves as its folder's index, so an exercise brief lives at
      # .../exercises/<folder>/.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4

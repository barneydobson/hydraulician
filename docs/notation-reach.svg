   viewBox="0 0 800 299.14536"
   role="img"
   aria-label="Definition sketch of a channel reach: uniform flow at normal depth d_n on a mild bed slope S_0, a sluice gate, a supercritical jet under it where the piezometric head h dips below the water level eta at the vena contracta, a hydraulic jump with conjugate depths d_1 and d_2 where h bulges above eta in the roller and the energy grade line H steps down by delta E, and a free overfall where the profile passes through critical depth d_c."

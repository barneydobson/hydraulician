<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hydraulician — 2D hydraulics in profile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<canvas id="view"></canvas>
<canvas id="over"></canvas>

<!-- The top strip. `#groups` is generated from the TOOLBAR spec in main.js —
     one icon per action, each with a hover card carrying its name, what it
     does and its shortcut. -->
<div id="bar" class="glass">
  <div id="brand">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#4dc3ff"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 2.5c3 4 5 6.5 5 9a5 5 0 1 1-10 0c0-2.5 2-5 5-9z"></path>
    </svg>
    <span class="word">Hydraulician</span>
  </div>
  <div id="groups"></div>
  <button id="title" type="button">
    <b id="sceneName">Sandbox</b><span class="caret">▾</span>
    <span id="sceneKey">Draw the hydraulics</span>
    <span id="status"></span>
  </button>
</div>

<!-- The colour key, and the field picker, because they are the same question.
     DOM rather than part of the overlay canvas: it carries a menu, a button
     and two editable numbers, which is hit-testing and text entry the 2D
     context would have to be taught from scratch. A window or CDP screenshot
     captures it either way, which is the point — a screenshot in a worksheet
     should say what it is showing. -->
<div id="legend" class="glass">
  <button id="legPick" type="button" title="Which variable the colour shows">
    <b id="legName">Water</b><i id="legSym"></i><span class="caret">▾</span>
  </button>
  <!-- The mode switch lives HERE, on the legend, because the legend is what
       declares which flow you are looking at: under Average the colour, the
       surface line and every instrument come from one window, and each field's
       own `mean` string prints two rows below this. Putting the statement and
       the switch on one object is what stops them disagreeing. `setAverage` is
       still the single writer -- the strip's A, the panel checkbox and this all
       go through it. -->
  <div id="legMode" role="group" aria-label="Live or averaged flow">
    <button id="legLive" type="button" aria-pressed="true"
            title="Show the flow as it is, frame by frame">Live</button>
    <button id="legAvgOn" type="button" aria-pressed="false"
            title="Time-average the flow — the colour and every reading over one window (A)">Average</button>
  </div>
  <div id="legBars"></div>
  <div id="legFoot">
    <span id="legLo" class="legnum" contenteditable="true" spellcheck="false">0</span>
    <span class="grow"></span>
    <span id="legHi" class="legnum" contenteditable="true" spellcheck="false">1</span>
    <span id="legUnit"></span>
  </div>
  <div id="legActs">
    <button id="legFit" type="button" title="Rescale once to this frame — the 99th percentile over wet cells">Fit</button>
    <button id="legDef" type="button" title="Back to the scene's own scale">⟲ scene</button>
  </div>
  <!-- Average: docs/averaging.md §6 (what the nonlinear fields become) and
       §7.3 (the line is η̄, the depth is d̄, and δ_a is the difference).
       DELIBERATELY SHORT. This block used to carry two further paragraphs —
       what the window covers, and the six things that restart it — about seven
       lines of prose that never changed. Both already exist, verbatim in
       substance, in the Controls panel's own `info` for Average and in
       docs/averaging.md §9; three copies of a list is how the three come to
       disagree. What is left is the window length, the hover readout and the
       field's own `mean` string: all of it either live or field-specific.
       The same lesson the exercise cards learned — see the note on `start`
       and `task` in js/exercises.js. -->
  <div id="legAvg">
    <div class="legahd"><b>Average</b><span id="legAvgT">T = 0.00 s</span></div>
    <div id="legAvgRead">— hover the water for the averaged column</div>
    <div id="legAvgWhat" class="legnote"></div>
  </div>
  <button class="minbtn corner" id="legX" title="Put the legend away (L)">–</button>
</div>
<div id="legmenu" class="glass"></div>
<div id="tip" class="glass"></div>

<div id="scenemenu" class="glass gmenu" role="menu" aria-label="Scenes"></div>
<div id="exmenu" class="glass gmenu" role="menu" aria-label="Exercises"></div>
<div id="keysmenu" class="glass gmenu" aria-label="Keyboard shortcuts"></div>

<div id="toast" class="glass">
  <div id="toastTitle"></div>
  <div id="toastSub"></div>
</div>

<div id="panel" class="glass"></div>

<div id="hint" class="glass"></div>

<!-- The docked side panel: the loaded exercise, never floating over the water.
     Its contents are built in main.js (see EX.card). -->
<aside id="dock" aria-label="Exercise">
  <div class="dock-h">
    <span class="eid"></span>
    <span class="kind">Exercise</span>
    <span class="grow"></span>
    <button class="dock-x" data-a="close" aria-label="Close">×</button>
  </div>
  <div class="dock-body"></div>
  <div class="dock-foot"></div>
</aside>
<button id="dockfold" type="button" aria-label="Fold the panel away">
  <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M7 4l6 6-6 6"></path>
  </svg>
</button>
<button id="docktab" type="button" aria-label="Reopen the panel">
  <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M13 4l-6 6 6 6"></path>
  </svg>
  <span class="eid"></span>
  <span class="kind">exercise</span>
</button>

<!-- The start screen. The pack list and the side doors are built in main.js
     (see START) from the exercise register. -->
<div id="start">
  <div id="startwrap">
    <div id="starthead">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 20 20" fill="none" stroke="#4dc3ff"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 2.5c3 4 5 6.5 5 9a5 5 0 1 1-10 0c0-2.5 2-5 5-9z"></path>
        </svg>
        <h1>Hydraulician</h1>
      </div>
      <p>2D hydraulics in the vertical plane — pick an exercise, or draw your own</p>
    </div>
    <div id="startcols">
      <div id="startpack" class="glass">
        <div class="ph"><b>The exercise pack</b><i id="startcount"></i></div>
        <div class="pf"><input id="startfilter" type="search" placeholder="Filter by id, title or topic…"></div>
        <div id="startlist"></div>
      </div>
      <div id="startside"></div>
    </div>
    <div id="startfoot">
      <a id="startabout" target="_blank" rel="noopener">What the solver is actually doing — the numerics ↗</a>
    </div>
  </div>
</div>

<script src="js/gl.js"></script>
<script src="js/reconstruct.js"></script>
<script src="js/shaders.js"></script>
<script src="js/scenes.js"></script>
<script src="js/sim.js"></script>
<script src="js/overlay.js"></script>
<!-- The teaching pack: the exercise list, and (optionally) the drawn rigs it
     points at. Both are plain data; a missing rig pack only costs you the
     drawing, and the exercise still loads its scene and its settings. -->
<script src="js/exercises.js"></script>
<script src="js/exercises-rigs.js"></script>
<!-- Modules lifted out of main.js. They must load BEFORE it: main.js ends by
     putting PICKER, EX, GINSP and RIG on window.APP, and that runs at parse
     time, so the bindings have to exist by then. Everything pointing the
     other way (these files reaching back for state, sim, syncPanel and the
     rest) is inside a function body and resolves when called. -->
<script src="js/pickers.js"></script>
<script src="js/gauge-inspector.js"></script>
<script src="js/rig.js"></script>
<script src="js/main.js"></script>
</body>
</html>

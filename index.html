<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hydraulician — 2D hydraulics in profile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💧</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #070b0f; }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #dfe8f2; }

  /* --dock is the width the docked side panel takes OUT of the viewport. The
     canvases are inset by it, so the simulation is never drawn underneath the
     panel — a docked panel that overlaps the water is just a floating card
     with extra steps. Everything that centres on the water (the tips line, the
     toast) centres on `100vw - var(--dock)` for the same reason. */
  /* --dock is what the side panel takes; --dockb is what the same panel takes
     as a bottom sheet on a phone. One of the two is always zero. */
  :root { --dock: 0px; --dockb: 0px; --sheet-h: min(58vh, 520px); }

  /* Sized, not just inset: a <canvas> has an intrinsic 300 × 150, and a fixed
     box with `width: auto` keeps it rather than stretching to the four edges. */
  #view, #over {
    position: fixed; top: 0; left: 0;
    width: calc(100vw - var(--dock)); height: calc(100vh - var(--dockb));
  }
  #view { touch-action: none; cursor: crosshair; }
  #over { pointer-events: none; }

  .glass {
    background: rgba(12, 17, 26, 0.60);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  }

  /* ------------------------------------------------ minimisable UI boxes */
  /* A floating box carries a small – in a corner; clicking it collapses the
     box to a pill that restores it. The boxes are chrome and the water is the
     point — a lecture wants the water. */
  .minbtn {
    appearance: none; border: 0; background: transparent; color: inherit;
    width: 20px; height: 20px; padding: 0; border-radius: 6px;
    font: 14px/18px ui-monospace, monospace; text-align: center;
    cursor: pointer; opacity: .40; flex: 0 0 auto;
  }
  .minbtn:hover { opacity: 1; background: rgba(255,255,255,0.12); }
  .minbtn.corner { position: absolute; top: 5px; right: 5px; z-index: 3; }
  .minbtn.cornerL { position: absolute; top: 5px; left: 5px; z-index: 3; }
  .minpill {
    position: fixed; z-index: 10; padding: 6px 12px; cursor: pointer;
    font: 600 12px system-ui, sans-serif; opacity: .78; display: none;
    white-space: nowrap; user-select: none;
  }
  .minpill:hover { opacity: 1; background: rgba(20, 30, 44, 0.72); }
  .minpill.show { display: block; }

  /* ------------------------------------------------------------- top strip */
  /* ONE horizontal bar across the top of the water: the mark, the icon groups,
     and the scene chip at its right end. Everything that used to be a worded
     button is an icon with a hover card carrying its name, what it does and
     its shortcut — sixteen words of chrome became sixteen glyphs. */
  #bar {
    position: fixed; top: 10px; left: 12px; right: calc(var(--dock) + 12px);
    z-index: 10; height: 52px; display: flex; align-items: center; gap: 4px;
    padding: 0 8px 0 12px;
  }
  #brand {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    font-size: 13.5px; font-weight: 600; letter-spacing: .02em;
    opacity: .92; padding-right: 4px; white-space: nowrap;
  }
  #brand svg { flex: 0 0 auto; }
  /* The strip must never silently drop a control. It shrinks first (the two
     media queries below), and if a window is narrower than even that, the
     groups scroll sideways rather than being clipped away. */
  #groups {
    display: flex; align-items: center; gap: 4px; flex: 0 1 auto; min-width: 0;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  #groups::-webkit-scrollbar { display: none; }
  .tgrp { display: flex; align-items: center; gap: 2px; }
  .tbtn {
    appearance: none; border: 0; background: transparent; padding: 0;
    width: 36px; height: 36px; flex: 0 0 auto; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(223,232,242,0.78); cursor: pointer;
    transition: background .12s, color .12s;
  }
  .tbtn:hover { background: rgba(255,255,255,0.10); color: #dfe8f2; }
  .tbtn:focus-visible { outline: 2px solid rgba(77,195,255,0.7); outline-offset: -2px; }
  /* `.active` is the class the two menus set on their own opener (see PICKER /
     EX), so it is spelled the same as `.on` rather than teaching those modules
     a second word for "lit". */
  .tbtn.on, .tbtn.active {
    background: rgba(77,195,255,0.20); color: #dfe8f2;
    box-shadow: inset 0 0 0 1px rgba(77,195,255,0.55);
  }
  /* A held state that is NOT a tool choice (valves shut, the clock stopped) is
     amber: "this rig is not in its normal condition" is a different kind of
     fact from "this is the tool in your hand". */
  .tbtn.hot {
    background: rgba(255,182,72,0.18); color: #ffd9a0;
    box-shadow: inset 0 0 0 1px rgba(255,182,72,0.50);
  }
  .tsep { width: 1px; height: 22px; background: rgba(255,255,255,0.13); margin: 0 4px; flex: 0 0 auto; }

  /* The scene chip: still the scene picker's affordance, now the right end of
     the strip. Two lines — what is loaded, and the live clock. */
  /* `flex-shrink: 100` against the groups' 1: when the strip runs out of room
     the SCENE NAME gives way (and ellipsizes), never a control. */
  #title {
    margin-left: auto; flex: 0 100 auto; max-width: 300px; min-width: 92px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: block; text-align: right; cursor: pointer; appearance: none;
    background: transparent; border: 1px solid transparent; border-radius: 10px;
    color: inherit; font: inherit; padding: 5px 10px;
    transition: background .12s, border-color .12s;
  }
  #title:hover, #title.open { background: rgba(255,255,255,0.08); border-color: rgba(77,195,255,0.40); }
  #title:focus-visible { outline: 2px solid rgba(77,195,255,0.7); outline-offset: 2px; }
  #title b { font-size: 13px; letter-spacing: .01em; }
  #title .caret { font-size: 9px; opacity: .5; margin-left: 5px; vertical-align: 1.5px; }
  #title:hover .caret, #title.open .caret { color: #7fd4ff; opacity: 1; }
  #sceneKey { display: none; }
  #status {
    display: block; font: 10px ui-monospace, SFMono-Regular, monospace;
    opacity: .48; margin-top: 1px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Two steps of compaction, applied by `fitBar()` from a MEASUREMENT of the
     strip rather than from a viewport media query — the side panel takes its
     width out of the bar too, so the window size does not say whether the
     icons fit. */
  #bar.tight .tbtn { width: 32px; height: 32px; }
  #bar.tight .tsep { margin: 0 2px; }
  #bar.tight #brand .word { display: none; }
  #bar.tighter .tbtn { width: 30px; height: 30px; }
  #bar.tighter #groups { gap: 2px; }
  #bar.tighter .tgrp { gap: 0; }
  #bar.tighter #status { display: none; }
  /* At this width the mark is the only thing on the strip that is decoration,
     so it is the last thing to go before a control would have to. */
  #bar.tighter #brand { display: none; }
  #bar.tighter { padding: 0 6px; }
  /* The strip has more in it than fits, and a hard edge reads as "that is all
     of them". The fade says it carries on. */
  #bar.scrolls #groups {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent);
  }

  /* ---------------------------------------------------------- hover card */
  /* Replaces every `title=` on the strip: a native tooltip cannot carry the
     shortcut, waits half a second, and cannot be styled. */
  #tip {
    position: fixed; z-index: 40; display: none; padding: 7px 11px;
    pointer-events: none; max-width: 320px;
  }
  #tip.show { display: flex; align-items: center; gap: 9px; }
  #tip b { font: 600 12.5px system-ui, sans-serif; white-space: nowrap; }
  #tip span { font-size: 11.5px; opacity: .62; }
  #tip kbd {
    font: 10.5px ui-monospace, monospace; background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 1px 5px;
    flex: 0 0 auto; margin-left: auto;
  }

  #hint {
    position: fixed; bottom: calc(var(--dockb) + 18px);
    z-index: 10; padding: 9px 34px 9px 18px;
    left: calc((100vw - var(--dock)) / 2); transform: translateX(-50%);
    font-size: 13px; opacity: .92; pointer-events: none; text-align: center;
    max-width: min(640px, 70vw);
  }
  #hint b { color: #7fd4ff; }
  #hint .minbtn { pointer-events: auto; }

  #toast {
    position: fixed; top: 76px; z-index: 11; padding: 12px 20px; text-align: center;
    left: calc((100vw - var(--dock)) / 2); transform: translateX(-50%) translateY(-8px);
    opacity: 0; transition: opacity .35s, transform .35s;
    pointer-events: none; max-width: min(560px, 80vw);
  }
  /* An announcement is dismissable the moment it is readable. */
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0);
    pointer-events: auto; cursor: pointer; }
  #toastTitle { font-weight: 700; font-size: 14.5px; }
  #toastSub { font-size: 12.5px; opacity: .72; margin-top: 2px; }

  #panel {
    position: fixed; top: 72px; left: 14px; z-index: 10;
    width: min(340px, calc(100vw - 28px));
    padding: 14px 16px; display: none; max-height: calc(100vh - 100px); overflow: auto;
  }
  #panel.open { display: block; }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  #panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .5; margin: 15px 0 4px; }
  #panel h3:first-child { margin-top: 0; }
  #panel label.row { display: flex; align-items: center; gap: 8px; margin: 7px 0 1px; font-size: 13px; }
  #panel .row .lbl { flex: 1 1 auto; white-space: nowrap; }
  #panel input[type=range] { width: 138px; flex: 0 0 auto; accent-color: #4dc3ff; }
  #panel .notes { font: 11px ui-monospace, SFMono-Regular, monospace; opacity: .5; margin: 0 0 6px; min-height: 12px; }
  #panel .info { flex: 0 0 auto; opacity: .35; cursor: help; font-size: 12px; padding: 2px; user-select: none; }
  #panel .info:hover { opacity: .9; }
  #panel select, #panel input[type=checkbox] { accent-color: #4dc3ff; }
  #panel select {
    background: rgba(255,255,255,0.08); color: inherit; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 7px; padding: 3px 6px; font: inherit; font-size: 12.5px;
  }

  #panel .btnrow { display: flex; gap: 4px; flex: 0 0 auto; }
  #panel .btnrow button {
    appearance: none; background: rgba(255,255,255,0.07); color: inherit;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 7px;
    font: 600 11.5px ui-monospace, SFMono-Regular, monospace;
    padding: 3px 8px; cursor: pointer;
  }
  #panel .btnrow button:hover:not(:disabled) { background: rgba(77,195,255,0.20); }
  #panel .btnrow button:disabled { opacity: .35; cursor: default; }

  /* ------------------------------------------------------ rig save / share */
  #panel .row.stack { flex-wrap: wrap; }
  #panel .rigui { flex: 1 0 100%; display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  #panel .rigrow { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #panel .rigui button, #panel .rigfile {
    appearance: none; background: rgba(255,255,255,0.07); color: inherit;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 7px;
    font: 600 11.5px ui-monospace, SFMono-Regular, monospace;
    padding: 4px 9px; cursor: pointer; white-space: nowrap;
  }
  #panel .rigui button:hover, #panel .rigfile:hover { background: rgba(77,195,255,0.20); }
  #panel .rigtx {
    width: 100%; height: 52px; resize: vertical; display: block;
    background: rgba(0,0,0,0.28); color: #dfe8f2;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    font: 10.5px/1.35 ui-monospace, SFMono-Regular, monospace;
    padding: 6px 7px; user-select: text; word-break: break-all;
  }
  #panel .rigtx:focus { outline: 1px solid rgba(77,195,255,0.55); }
  #panel .rigtx::placeholder { color: rgba(223,232,242,0.35); }
  #panel .rigmsg {
    font: 10.5px ui-monospace, SFMono-Regular, monospace; opacity: .62;
    margin-left: auto; text-align: right; color: #7fd4ff;
  }

  /* ------------------------------------------------ gauge inspector windows */
  .gcardBtn {
    position: fixed; z-index: 12; width: 19px; height: 19px; padding: 0;
    appearance: none; cursor: pointer; color: #dfe8f2;
    background: rgba(12,17,26,0.85); border: 1px solid rgba(255,255,255,0.20);
    border-radius: 6px; font: 11px/17px ui-monospace, monospace; text-align: center;
  }
  .gcardBtn:hover { background: rgba(77,195,255,0.30); }

  .ginsp {
    position: fixed; z-index: 21; width: 400px;
    font-size: 12px; user-select: none; touch-action: none;
  }
  .ginsp-h {
    display: flex; align-items: center; gap: 7px; padding: 8px 10px;
    cursor: move; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .ginsp-dot { width: 9px; height: 9px; border-radius: 50%; background: #7fd4ff; flex: 0 0 auto; }
  .ginsp-h b { font-size: 12.5px; letter-spacing: .01em; white-space: nowrap; }
  .ginsp-pos { font: 10.5px ui-monospace, SFMono-Regular, monospace; opacity: .58;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ginsp-grow { flex: 1 1 auto; }
  .ginsp-x {
    appearance: none; border: 0; background: transparent; color: inherit;
    font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: 6px; cursor: pointer;
  }
  .ginsp-x:hover { background: rgba(255,255,255,0.12); }

  .ginsp-vals { display: flex; gap: 6px; padding: 8px 10px 2px; }
  .ginsp-vals div {
    flex: 1 1 0; padding: 4px 6px; border-radius: 7px;
    background: rgba(255,255,255,0.04); border: 1px solid transparent;
  }
  .ginsp-vals div.on { border-color: rgba(77,195,255,0.40); background: rgba(77,195,255,0.10); }
  .ginsp-vals span { font: 10px ui-monospace, monospace; opacity: .55; }
  .ginsp-vals b { display: block; font: 700 12.5px ui-monospace, monospace;
    font-variant-numeric: tabular-nums; margin: 1px 0; user-select: text; }
  .ginsp-vals i { display: block; font-style: normal; font-size: 9.5px; opacity: .42; line-height: 1.25; }

  .ginsp-tabs { display: flex; gap: 4px; padding: 7px 10px 6px; }
  .ginsp-tabs button {
    appearance: none; background: rgba(255,255,255,0.06); color: inherit;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
    font: 600 10.5px ui-monospace, monospace; padding: 2px 10px; cursor: pointer;
  }
  .ginsp-tabs button.on { background: rgba(77,195,255,0.22); border-color: rgba(77,195,255,0.55); }

  .ginsp-c {
    display: block; width: calc(100% - 20px); height: 158px; margin: 0 10px;
    cursor: crosshair; touch-action: none;
  }

  .ginsp-foot { display: flex; align-items: center; gap: 6px; padding: 8px 10px 2px; }
  .ginsp-b {
    appearance: none; background: rgba(255,255,255,0.07); color: inherit;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    font: 600 11px system-ui, sans-serif; padding: 4px 9px; cursor: pointer;
    white-space: nowrap; flex: 0 0 auto;
  }
  .ginsp-b:hover { background: rgba(77,195,255,0.20); }
  .ginsp-span {
    margin-left: auto; text-align: right; font: 10px ui-monospace, monospace;
    opacity: .5; font-variant-numeric: tabular-nums; user-select: text;
  }
  .ginsp-span.frozen { color: #ffb648; opacity: .8; }
  .ginsp-cap { padding: 6px 10px 10px; font-size: 10px; line-height: 1.4; opacity: .42; }
  .ginsp-cap b { opacity: .85; }
  @media (max-width: 560px) { .ginsp { width: calc(100vw - 20px); } }

  /* ------------------------------------------------------------ scene picker */
  /* One menu, three entry points (the strip's chip, its Scenes icon, the panel
     row). It is built from the SCENES registry every time it opens, so a scene
     added to js/scenes.js appears here with no further edit. */
  .gmenu {
    position: fixed; z-index: 30; width: 390px; max-width: calc(100vw - 24px);
    padding: 7px; display: none; max-height: calc(100vh - 96px); overflow: auto;
  }
  .gmenu.open { display: block; }
  .gmenu::-webkit-scrollbar { width: 6px; }
  .gmenu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  .gmenu .smh {
    display: flex; align-items: baseline; gap: 8px; padding: 5px 9px 7px;
    border-bottom: 1px solid rgba(255,255,255,0.07); margin-bottom: 3px;
  }
  .gmenu .smh b { font-size: 12.5px; letter-spacing: .01em; }
  .gmenu .smh i {
    font-style: normal; margin-left: auto; opacity: .45;
    font: 10.5px ui-monospace, SFMono-Regular, monospace;
  }
  .gmenu .smg {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    opacity: .45; padding: 10px 9px 3px;
  }
  .gmenu .smi {
    display: block; width: 100%; text-align: left; appearance: none;
    background: transparent; color: inherit; font: inherit;
    border: 1px solid transparent; border-radius: 9px;
    padding: 6px 9px 7px; cursor: pointer; transition: background .1s;
  }
  .gmenu .smi:hover, .gmenu .smi.hi { background: rgba(255,255,255,0.08); }
  .gmenu .smi.on {
    background: rgba(77,195,255,0.16); border-color: rgba(77,195,255,0.45);
  }
  .gmenu .smi b { font-size: 13px; font-weight: 600; }
  .gmenu .smi em {
    font-style: normal; margin-left: 7px; opacity: .45;
    font: 10px ui-monospace, SFMono-Regular, monospace;
  }
  .gmenu .smi .tag {
    float: right; font: 9.5px ui-monospace, monospace; letter-spacing: .06em;
    text-transform: uppercase; opacity: .75; color: #7fd4ff; margin-top: 3px;
  }
  .gmenu .smi p { font-size: 11.5px; line-height: 1.35; opacity: .60; margin: 2px 0 0; }
  .gmenu .smwarn {
    margin: 4px 2px 2px; padding: 8px 10px; border-radius: 9px;
    background: rgba(255,182,72,0.12); border: 1px solid rgba(255,182,72,0.45);
    font-size: 11.5px; line-height: 1.4;
  }
  .gmenu .smwarn b { color: #ffb648; }
  .gmenu .smwarn .r { display: flex; gap: 5px; margin-top: 7px; }
  .gmenu .smwarn button {
    appearance: none; background: rgba(255,255,255,0.07); color: inherit;
    border: 1px solid rgba(255,255,255,0.20); border-radius: 7px;
    font: 600 11px system-ui, sans-serif; padding: 4px 10px; cursor: pointer;
  }
  .gmenu .smwarn button:hover { background: rgba(255,255,255,0.16); }
  .gmenu .smwarn button.go { border-color: rgba(255,182,72,0.6); color: #ffd9a0; }

  /* ---------------------------------------------------------- exercises */
  /* The exercise menu is the scene menu's twin (.gmenu above) plus a filter
     box and an id chip. Picking one loads it into the side panel below. */
  #exmenu { width: 428px; }
  .gmenu .smf {
    display: block; width: calc(100% - 6px); margin: 2px 3px 4px;
    background: rgba(0,0,0,0.28); color: #dfe8f2;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    font: 12px system-ui, sans-serif; padding: 5px 8px;
  }
  .gmenu .smf:focus { outline: 1px solid rgba(77,195,255,0.55); }
  .gmenu .smf::placeholder { color: rgba(223,232,242,0.35); }
  .gmenu .smi .eid {
    display: inline-block; min-width: 38px; margin-right: 7px;
    font: 700 10.5px ui-monospace, SFMono-Regular, monospace;
    color: #7fd4ff; letter-spacing: .04em;
  }
  .gmenu .smi .rigtag {
    float: right; font: 9.5px ui-monospace, monospace; letter-spacing: .05em;
    text-transform: uppercase; opacity: .6; margin-top: 3px;
  }
  .gmenu .smnone { padding: 10px 9px; font-size: 12px; opacity: .5; }

  /* ------------------------------------------------------- keyboard sheet */
  #keysmenu { width: 336px; }
  #keysmenu .kline {
    display: flex; align-items: baseline; gap: 9px; padding: 3px 9px; font-size: 11.5px;
  }
  #keysmenu .kline span { opacity: .72; }
  #keysmenu kbd {
    background: rgba(255,255,255,0.10); border-radius: 4px; padding: 1px 5px;
    font: 10.5px ui-monospace, monospace; border: 1px solid rgba(255,255,255,0.12);
    flex: 0 0 auto; min-width: 62px; text-align: center;
  }

  /* ============================================================ side panel */
  /* The exercise lives HERE, not in a window over the water: the canvases are
     inset by --dock, so the panel takes its width out of the viewport instead
     of covering it. Below the width where there is anything to give away it
     goes back to overlaying (`.over`) and the canvas keeps the whole window. */
  #dock {
    position: fixed; top: 0; right: 0; bottom: 0; width: 348px; z-index: 14;
    display: none; flex-direction: column;
    background: rgba(12, 17, 26, 0.86);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255,255,255,0.09);
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.35);
  }
  #dock.open { display: flex; }
  #dock.over { width: min(348px, 100vw); box-shadow: -8px 0 48px rgba(0,0,0,0.6); }
  .dock-h {
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
    padding: 14px 12px 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .dock-h .eid {
    font: 700 11px ui-monospace, monospace; color: #7fd4ff; letter-spacing: .04em;
    background: rgba(77,195,255,0.14); border-radius: 6px; padding: 2px 6px; flex: 0 0 auto;
  }
  .dock-h .kind {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; opacity: .5;
  }
  .dock-h .grow { flex: 1 1 auto; }
  .dock-x {
    appearance: none; border: 0; background: transparent; color: inherit;
    font-size: 16px; line-height: 1; padding: 3px 7px; border-radius: 7px;
    cursor: pointer; opacity: .6;
  }
  .dock-x:hover { opacity: 1; background: rgba(255,255,255,0.12); }
  .dock-body {
    flex: 1 1 auto; overflow: auto; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 11px; font-size: 12px;
  }
  .dock-body::-webkit-scrollbar { width: 6px; }
  .dock-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  .dock-foot {
    flex: 0 0 auto; display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.08);
  }
  /* The seam handle: a tab straddling the panel's left edge that folds it away,
     and the same tab parked on the window edge to bring it back. */
  #dockfold, #docktab {
    position: fixed; z-index: 15; appearance: none; cursor: pointer; color: #dfe8f2;
    background: rgba(12,17,26,0.92); border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 4px 24px rgba(0,0,0,0.35); display: none; padding: 0;
  }
  #dockfold {
    width: 26px; height: 52px; top: 50%; margin-top: -26px;
    right: calc(var(--dock) - 13px); border-radius: 8px;
    align-items: center; justify-content: center;
  }
  #dockfold.show { display: flex; }
  #dockfold:hover, #docktab:hover { background: rgba(77,195,255,0.25); }
  #docktab {
    right: 0; top: 50%; margin-top: -60px; width: 30px; padding: 12px 4px;
    border-right: 0; border-radius: 10px 0 0 10px;
    flex-direction: column; align-items: center; gap: 8px;
  }
  #docktab.show { display: flex; }
  #docktab .eid {
    writing-mode: vertical-rl; font: 700 10.5px ui-monospace, monospace;
    color: #7fd4ff; letter-spacing: .06em;
  }
  #docktab .kind {
    writing-mode: vertical-rl; font-size: 9.5px; text-transform: uppercase;
    letter-spacing: .08em; opacity: .5;
  }

  /* ------------------------------------------------- the panel as a sheet */
  /* On a phone a 348px panel down the side would leave a 40px slice of water,
     which is no use to anybody. It becomes a bottom sheet instead: the flume
     keeps the top of the screen — the only part of a phone tall enough to
     read one in — and the brief takes the bottom, where a thumb is. */
  #dock.sheet {
    top: auto; left: 0; right: 0; bottom: 0; width: auto;
    height: var(--sheet-h);
    border-left: 0; border-top: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.45);
  }
  /* A grab bar, so the thing reads as a sheet rather than as a stuck dialog. */
  #dock.sheet .dock-h::before {
    content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 34px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.22);
  }
  #dock.sheet .dock-h { position: relative; padding-top: 18px; }
  /* The seam handle has no seam to sit on; the × closes and the pill reopens. */
  #dock.sheet ~ #dockfold { display: none; }
  #dock.sheet ~ #docktab {
    top: auto; bottom: 14px; right: 14px; margin-top: 0; width: auto;
    flex-direction: row; align-items: center; gap: 7px; padding: 9px 14px;
    border-right: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
  }
  #dock.sheet ~ #docktab .eid, #dock.sheet ~ #docktab .kind { writing-mode: horizontal-tb; }

  /* ------------------------------------------------------ touch machines */
  /* A finger is not a mouse pointer: 44px is the smallest target most people
     hit reliably, and anything under a 16px font makes iOS Safari zoom the
     page the moment the field is focused. */
  @media (pointer: coarse) {
    .tbtn { width: 44px; height: 44px; }
    #bar.tight .tbtn { width: 42px; height: 42px; }
    #bar.tighter .tbtn { width: 40px; height: 40px; }
    #bar { height: 58px; }
    #panel { top: 78px; }
    /* Shortcuts are for machines with keys. */
    #keysBtn { display: none; }
    .dock-x { font-size: 20px; padding: 6px 10px; }
    .exb, #dock .exd input, #startpack .pf input, .gmenu .smf,
    #dock .exset > summary { font-size: 16px; }
    .gmenu .smi { padding: 10px 9px 11px; }
    #startlist .si { padding: 9px 8px; }
  }

  /* The exercise brief inside the panel. ONE neutral style: no green "your
     values" block, no amber warning, no blue "you draw this" — a brief that
     colour-codes six kinds of sentence is one nobody reads in a lecture.
     Emphasis is a bold lead-in and nothing else. */
  #dock .extitle { font-size: 14.5px; font-weight: 700; line-height: 1.3; }
  #dock .exline { font-size: 12px; line-height: 1.5; user-select: text; }
  #dock .exline b { font-weight: 700; opacity: .78; }
  #dock .exyours { white-space: pre-line; }
  #dock .exd { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  #dock .exd label { font-size: 11.5px; opacity: .72; white-space: nowrap; }
  #dock .exd input {
    width: 52px; background: rgba(0,0,0,0.30); color: #dfe8f2; text-align: center;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 7px;
    font: 700 13px ui-monospace, monospace; padding: 3px 5px;
  }
  #dock .exd input:focus { outline: 1px solid rgba(77,195,255,0.55); }
  #dock .exval { font: 11.5px ui-monospace, monospace; opacity: .85; user-select: text; }
  #dock .exsteps {
    margin: 0; padding-left: 18px; font-size: 12px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 3px; user-select: text;
  }
  #dock .exsteps li { opacity: .88; }
  #dock .exset { font-size: 11px; user-select: text; }
  #dock .exset > summary {
    cursor: pointer; opacity: .62; list-style: none;
    font: 10px ui-monospace, monospace; letter-spacing: .03em; padding: 2px 0;
  }
  #dock .exset > summary::before { content: "▸ "; }
  #dock .exset[open] > summary::before { content: "▾ "; }
  #dock .exset > summary:hover { opacity: .95; }
  #dock .exsetl {
    display: flex; flex-direction: column; gap: 2px; padding: 6px 9px; margin-top: 3px;
    background: rgba(255,255,255,0.05); border-radius: 7px; opacity: .78;
    font: 10.5px ui-monospace, monospace;
  }
  #dock .exsetl b { opacity: .9; font-weight: 700; }
  #dock .exsetl i {
    display: block; font-style: normal; opacity: .7; padding-left: 9px;
    font: 10px system-ui, sans-serif; line-height: 1.35;
  }
  #dock .exsettle { font: 10.5px ui-monospace, monospace; opacity: .6; }
  .exb {
    appearance: none; background: rgba(255,255,255,0.07); color: inherit;
    border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
    font: 600 11px system-ui, sans-serif; padding: 5px 10px; cursor: pointer; white-space: nowrap;
  }
  .exb:hover { background: rgba(77,195,255,0.20); }
  .exlink {
    font: 10px ui-monospace, monospace; opacity: .5; margin-left: auto;
    color: inherit; text-decoration: none; user-select: text;
  }
  .exlink:hover { opacity: .9; color: #7fd4ff; text-decoration: underline; }

  /* =========================================================== start screen */
  /* This is a TEACHING tool, so it opens on the teaching pack: the exercises
     are the front door and the sandbox is a deliberate choice beside them,
     not the other way round. The simulation keeps running dimmed behind it —
     the thing is alive before you have chosen anything. Any `?scene=`, `?ex=`
     or `#rig=` link skips this screen entirely, so a lecture permalink lands
     exactly where it always did. */
  #start {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: rgba(7, 11, 15, 0.74);
    backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
    overflow: auto; padding: 40px 24px;
  }
  #start.open { display: block; }
  #startwrap { width: min(1180px, 100%); margin: 0 auto; }
  #starthead { text-align: center; margin-bottom: 26px; }
  #starthead .mark { display: flex; align-items: center; justify-content: center; gap: 12px; }
  #starthead h1 { font-size: 27px; font-weight: 700; letter-spacing: .01em; }
  #starthead p { font-size: 13px; opacity: .6; margin-top: 6px; }
  #startcols { display: flex; gap: 22px; align-items: flex-start; }
  #startpack { flex: 1 1 auto; min-width: 0; padding: 0; overflow: hidden; }
  #startside { flex: 0 0 320px; display: flex; flex-direction: column; gap: 14px; }
  @media (max-width: 900px) { #startcols { flex-direction: column; } #startside { flex: 1 1 auto; width: 100%; } }

  #startpack .ph {
    display: flex; align-items: baseline; gap: 8px;
    padding: 14px 16px 11px; border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  #startpack .ph b { font-size: 13.5px; }
  #startpack .ph i { font-style: normal; margin-left: auto; opacity: .45; font: 10.5px ui-monospace, monospace; }
  #startpack .pf { padding: 10px 12px 4px; }
  #startpack .pf input {
    display: block; width: 100%; background: rgba(0,0,0,0.28); color: #dfe8f2;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
    font: 12.5px system-ui, sans-serif; padding: 7px 10px;
  }
  #startpack .pf input:focus { outline: 1px solid rgba(77,195,255,0.55); }
  #startpack .pf input::placeholder { color: rgba(223,232,242,0.35); }
  /* Two real columns, balanced in JS (see START.renderList). NOT CSS
     `columns` — a multi-column box with a max-height lays its overflow out
     SIDEWAYS, so the pack scrolled horizontally and two thirds of it could
     not be reached — and not a grid either, whose rows are as tall as their
     tallest group and leave the short one trailing white space. */
  #startlist {
    display: flex; gap: 18px; align-items: flex-start; padding: 8px 14px 16px;
    max-height: min(52vh, 460px); overflow-y: auto; overflow-x: hidden;
  }
  #startlist .col { flex: 1 1 0; min-width: 0; }
  @media (max-width: 700px) { #startlist { flex-direction: column; gap: 0; } }
  #startlist::-webkit-scrollbar { width: 6px; }
  #startlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }
  #startlist .g { break-inside: avoid; margin-bottom: 10px; }
  #startlist .gh {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em;
    opacity: .45; padding: 6px 8px 4px;
  }
  #startlist .si {
    display: block; width: 100%; text-align: left; appearance: none;
    background: transparent; color: inherit; font: inherit;
    border: 1px solid transparent; border-radius: 8px;
    padding: 5px 8px; cursor: pointer;
  }
  #startlist .si:hover, #startlist .si.hi { background: rgba(255,255,255,0.08); }
  #startlist .si .eid {
    display: inline-block; min-width: 38px;
    font: 700 10.5px ui-monospace, monospace; color: #7fd4ff; letter-spacing: .04em;
  }
  #startlist .si .t { font-size: 12px; }
  #startlist .none { padding: 10px 8px; font-size: 12px; opacity: .5; }

  .startcard {
    display: block; width: 100%; text-align: left; appearance: none;
    color: inherit; font: inherit; cursor: pointer; padding: 15px 16px 14px;
    transition: border-color .12s, background .12s;
  }
  .startcard:hover { background: rgba(20, 30, 44, 0.72); border-color: rgba(77,195,255,0.45); }
  .startcard .r { display: flex; align-items: center; gap: 9px; }
  .startcard b { font-size: 13.5px; }
  .startcard .go { margin-left: auto; opacity: .5; }
  .startcard p { font-size: 12px; line-height: 1.5; opacity: .65; margin: 7px 0 0; }
  .startcard.primary { border-color: rgba(77,195,255,0.35); }
  @media (max-width: 620px) {
    #start { padding: 18px 12px 28px; }
    #starthead { margin-bottom: 16px; }
    #starthead h1 { font-size: 22px; }
    #starthead .mark svg { width: 24px; height: 24px; }
    #starthead p { font-size: 12px; }
    #startcols { gap: 14px; }
    #startlist { max-height: min(46vh, 400px); }
  }
  #startfoot { text-align: center; margin-top: 22px; font-size: 11.5px; opacity: .5; }
  #startfoot a { color: inherit; text-decoration: none; }
  #startfoot a:hover { color: #7fd4ff; text-decoration: underline; }
</style>
</head>
<body>

<canvas id="view"></canvas>
<canvas id="over"></canvas>

<!-- The top strip. `#groups` is generated from the TOOLBAR spec in main.js —
     one icon per action, each with a hover card carrying its name, what it
     does and its shortcut. -->
<div id="bar" class="glass">
  <div id="brand">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#4dc3ff"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 2.5c3 4 5 6.5 5 9a5 5 0 1 1-10 0c0-2.5 2-5 5-9z"></path>
    </svg>
    <span class="word">Hydraulician</span>
  </div>
  <div id="groups"></div>
  <button id="title" type="button">
    <b id="sceneName">Sandbox</b><span class="caret">▾</span>
    <span id="sceneKey">Draw the hydraulics</span>
    <span id="status"></span>
  </button>
</div>

<div id="tip" class="glass"></div>

<div id="scenemenu" class="glass gmenu" role="menu" aria-label="Scenes"></div>
<div id="exmenu" class="glass gmenu" role="menu" aria-label="Exercises"></div>
<div id="keysmenu" class="glass gmenu" aria-label="Keyboard shortcuts"></div>

<div id="toast" class="glass">
  <div id="toastTitle"></div>
  <div id="toastSub"></div>
</div>

<div id="panel" class="glass"></div>

<div id="hint" class="glass"></div>

<!-- The docked side panel: the loaded exercise, never floating over the water.
     Its contents are built in main.js (see EX.card). -->
<aside id="dock" aria-label="Exercise">
  <div class="dock-h">
    <span class="eid"></span>
    <span class="kind">Exercise</span>
    <span class="grow"></span>
    <button class="dock-x" data-a="close" aria-label="Close">×</button>
  </div>
  <div class="dock-body"></div>
  <div class="dock-foot"></div>
</aside>
<button id="dockfold" type="button" aria-label="Fold the panel away">
  <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M7 4l6 6-6 6"></path>
  </svg>
</button>
<button id="docktab" type="button" aria-label="Reopen the panel">
  <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M13 4l-6 6 6 6"></path>
  </svg>
  <span class="eid"></span>
  <span class="kind">exercise</span>
</button>

<!-- The start screen. The pack list and the side doors are built in main.js
     (see START) from the exercise register. -->
<div id="start">
  <div id="startwrap">
    <div id="starthead">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 20 20" fill="none" stroke="#4dc3ff"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 2.5c3 4 5 6.5 5 9a5 5 0 1 1-10 0c0-2.5 2-5 5-9z"></path>
        </svg>
        <h1>Hydraulician</h1>
      </div>
      <p>2D hydraulics in the vertical plane — pick an exercise, or draw your own</p>
    </div>
    <div id="startcols">
      <div id="startpack" class="glass">
        <div class="ph"><b>The exercise pack</b><i id="startcount"></i></div>
        <div class="pf"><input id="startfilter" type="search" placeholder="Filter by id, title or topic…"></div>
        <div id="startlist"></div>
      </div>
      <div id="startside"></div>
    </div>
    <div id="startfoot">
      <a id="startabout" target="_blank" rel="noopener">What the solver is actually doing — the numerics ↗</a>
    </div>
  </div>
</div>

<script src="js/gl.js"></script>
<script src="js/shaders.js"></script>
<script src="js/scenes.js"></script>
<script src="js/sim.js"></script>
<script src="js/overlay.js"></script>
<!-- The teaching pack: the exercise list, and (optionally) the drawn rigs it
     points at. Both are plain data; a missing rig pack only costs you the
     drawing, and the exercise still loads its scene and its settings. -->
<script src="js/exercises.js"></script>
<script src="js/exercises-rigs.js"></script>
<script src="js/main.js"></script>
</body>
</html>
